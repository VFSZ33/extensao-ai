            <label><input type="checkbox" name="whatsapping" />Whatsapp</label>

      </section>
      <form data-fixture="search" role="search">
        <input name="q" placeholder="Buscar" />
        <button type="submit">Buscar</button>
      </form>
      <section>
        <form
          novalidate
          data-fixture="section"
          data-gtag-action="Formulário Enviado"
          data-gtag-category="Formulário"
          data-gtag-label="Título da seção - Enviar"
        >
          <input type="hidden" name="origin_url" value="" />
          <input type="hidden" name="product" value="Página Inicial" />
          <input type="hidden" name="siteId" value="site-fixture" />
          <input type="hidden" name="teamId" value="team-fixture" />
          <input type="hidden" name="accountId" value="account-fixture" />
          <input type="hidden" name="channel" value="Home" />
          <label>
            Nome
            <input
              name="name"
              placeholder="Insira o Nome"
              id="form-field-name-ce5d59a0"
              required
            />
          </label>
          <label>
            E-mail
            <input
              name="email"
              placeholder="Insira o E-mail"
              id="form-field-email-bfcfdaba"
              required
            />
          </label>
          <label>
            Telefone
            <input
              name="phone"
              placeholder="Ex: (00) 0000-0000"
              id="form-field-phone-0f369c93"
              data-mask="phone"
              value=""
            />
          </label>
          <label>
            CPF
            <input
              name="cpf"
              placeholder="000.000.000-00"
              id="form-field-cpf-23e2eb6c"
              data-mask="cpf"
              required
              value=""
            />
          </label>
          <input type="hidden" name="unit" value="unit-fixture" />
          <fieldset>
            <label>
              <input type="checkbox" name="contactPreference[]" value="email" />
              E-mail
            </label>
            <label>
              <input
                type="checkbox"
                name="contactPreference[]"
                value="whatsapp"
              />
              Whatsapp
            </label>
            <label>
              <input
                type="checkbox"
                name="contactPreference[]"
                value="telefone"
              />
              Telefone
            </label>
          </fieldset>
          <fieldset>
            <label>
              <input type="checkbox" name="marketingConsent[]" value="true" />
              Autorizo o uso de minhas informações pessoais.
            </label>
          </fieldset>
          <button aria-label="Enviar" type="submit">Enviar</button>
        </form>
      </section>
      <section>
        <form
          data-fixture="offer"
          data-gtag-action="Formulário Enviado"
          data-gtag-category="Formulário"
          data-gtag-label="oferta - GEELY EX2 - Enviar"
        >
          <input name="name" data-af-field="fieldsToBeRendered/name" />
          <input name="email" data-af-field="fieldsToBeRendered/email" />
          <input
            name="phone"
            data-af-field="fieldsToBeRendered/phone"
            data-mask="phone"
            value=""
          />
          <div data-af-field="fieldsToBeRendered/contactPreference">
            <label><input type="checkbox" name="whatsapping" />Whatsapp</label>
            <label><input type="checkbox" name="phoning" />Ligação</label>
            <label><input type="checkbox" name="mailing" />E-mail</label>
          </div>
          <button data-af-field="buttonLabel" aria-label="Enviar" type="submit">
            Enviar
          </button>
        </form>
      </section>
      <section>
        <form
          data-fixture="stock"
          data-gtag-action="Formulário Enviado"
          data-gtag-category="Formulário"
          data-gtag-label="CRETA 1.0 TGDI FLEX COMFORT - Enviar"
          novalidate
        >
          <input name="origin_url" type="hidden" value="" />
          <input name="product" type="hidden" value="CRETA 1.0 TGDI" />
          <input name="category" type="hidden" value="Seminovos" />
          <input name="siteId" type="hidden" value="site-fixture" />
          <input name="teamId" type="hidden" value="team-fixture" />
          <input name="accountId" type="hidden" value="account-fixture" />
          <input name="content_entry_id" type="hidden" value="entry-fixture" />
          <input name="channel" type="hidden" value="Seminovos" />
          <label>
            Nome
            <input id="form-field-name-4a1c7e02" name="name" required />
          </label>
          <label>
            E-mail
            <input id="form-field-email-9d3b5f10" name="email" required />
          </label>
          <label>
            Telefone
            <input
              data-mask="phone"
              id="form-field-phone-6e8f2a31"
              name="phone"
              required
              value=""
            />
          </label>
          <label>
            Unidade
            <select data-controlled id="form-field-unit-1b2c3d4e" name="unit">
              <option value="">Selecione a unidade</option>
              <option value="unit-afogados">Unidade Afogados</option>
              <option value="unit-boa-viagem">Unidade Boa Viagem</option>
              <option value="unit-caruaru">Unidade Caruaru</option>
            </select>
          </label>
          <label>
            Mensagem
            <textarea
              data-controlled
              id="form-field-message-5f6a7b8c"
              name="message"
              rows="4"
            ></textarea>
          </label>
          <label>
            Melhor horário
            <input id="form-field-bestTime-0c9d8e7f" name="bestTime" />
          </label>
          <fieldset>
            <label>
              <input name="contactPreference[]" type="checkbox" value="email" />
              E-mail
            </label>
            <label>
              <input
                name="contactPreference[]"
                type="checkbox"
                value="whatsapp"
              />
              Whatsapp
            </label>
            <label>
              <input
                name="contactPreference[]"
                type="checkbox"
                value="telefone"
              />
              Telefone
            </label>
          </fieldset>
          <fieldset>
            <label>
              <input name="marketingConsent[]" type="checkbox" value="true" />
              Autorizo o uso de minhas informações pessoais.
            </label>
          </fieldset>
          <button aria-label="Enviar" type="submit">Enviar</button>
        </form>
      </section>
      <ol aria-label="Envios recebidos" id="submissions"></ol>
    </main>
    <button aria-label="Abrir WhatsApp" id="contact-modal-opener" type="button">
      WhatsApp
    </button>
    <template id="contact-modal">
      <div data-contact-modal>
        <div>
          <header>
            <h2>Fale por WhatsApp</h2>
            <button aria-label="Fechar" type="button">Fechar</button>
          </header>
          <form
            data-fixture="contact-modal"
            data-gtag-action="Formulário Enviado"
            data-gtag-category="Formulário"
            data-gtag-label="contact-form-modal - Fale por WhatsApp - iniciar conversa"
            novalidate
          >
            <label>
              NOME
              <input name="name" placeholder="Digite seu nome completo" />
            </label>
            <label>
              E-MAIL
              <input
                name="email"
                placeholder="Ex: joaosilva@empresa.com"
                type="email"
              />
            </label>
            <label>
              TELEFONE
              <input
                data-mask="phone"
                name="phone"
                placeholder="Digite seu telefone com DDD"
                value=""
              />
            </label>
            <div>
              <span>PREFERÊNCIA DE CONTATO</span>
              <label
                ><input name="whatsapping" type="checkbox" />Whatsapp</label
              >
              <label><input name="phoning" type="checkbox" />Telefone</label>
              <label><input name="mailing" type="checkbox" />E-mail</label>
            </div>
            <label>
              <input name="dataPermissions" type="checkbox" />
              Autorizo o uso de minhas informações pessoais para campanhas de
              marketing.
            </label>
            <button aria-label="INICIAR CONVERSA" type="submit">
              INICIAR CONVERSA
            </button>
          </form>
        </div>
      </div>
    </template>
    <script>
      const controlled = new Map();
      const masks = {
        cpf: (value) =>
          value
            .replace(/\D/g, "")
            .slice(0, 11)
            .replace(/(\d{3})(\d)/, "$1.$2")
            .replace(/(\d{3})(\d)/, "$1.$2")
            .replace(/(\d{3})(\d{1,2})$/, "$1-$2"),
        phone: (value) => {
          const digits = value.replace(/\D/g, "").slice(0, 11);

          if (digits.length > 10) {
            return digits.replace(/^(\d{2})(\d{5})(\d{0,4})/, "($1) $2-$3");
          }

          if (digits.length > 6) {
            return digits.replace(/^(\d{2})(\d{4})(\d{0,4})/, "($1) $2-$3");
          }

          return digits.replace(/^(\d{0,2})/, "($1");
        },
      };
      const nativeValue = Object.getOwnPropertyDescriptor(
        HTMLInputElement.prototype,
        "value",
      );

      function hasValidCpf(value) {
        const digits = [...value.replace(/\D/g, "")].map(Number);

        return (
          /^\d{3}\.\d{3}\.\d{3}-\d{2}$/.test(value) &&
          [9, 10].every((length) => {
            const sum = digits
              .slice(0, length)
              .reduce(
                (total, digit, index) => total + digit * (length + 1 - index),
                0,
              );

            return ((sum * 10) % 11) % 10 === digits[length];
          })
        );
      }

      function maskInput(input) {
        let rendered = "";
        let tracked = "";

        Object.defineProperty(input, "value", {
          configurable: true,
          get() {
            return nativeValue.get.call(this);
          },
          set(value) {
            tracked = String(value);
            nativeValue.set.call(this, value);
          },
        });
        input.addEventListener("input", () => {
          const current = nativeValue.get.call(input);

          if (current !== tracked) {
            rendered = masks[input.dataset.mask](current);
          }

          tracked = rendered;
          nativeValue.set.call(input, rendered);
        });
      }

      document
        .getElementById("contact-modal-opener")
        .addEventListener("click", () => {
          if (document.querySelector("[data-contact-modal]")) {
            return;
          }

          document.body.append(
            document.getElementById("contact-modal").content.cloneNode(true),
          );

          const modal = document.querySelector("[data-contact-modal]");

          modal.querySelectorAll("[data-mask]").forEach(maskInput);
          modal
            .querySelector('button[aria-label="Fechar"]')
            .addEventListener("click", () => {
              modal.remove();
            });
        });

      document.querySelectorAll("[data-mask]").forEach(maskInput);

      for (const field of document.querySelectorAll("[data-controlled]")) {
        controlled.set(field, field.value);
        field.addEventListener(
          field instanceof HTMLSelectElement ? "change" : "input",
          () => {
            controlled.set(field, field.value);
          },
        );
      }

      const validators = {
        "contact-modal": (data) =>
          Boolean(data.name.trim()) &&
          /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email) &&
          /^\(\d{2}\) \d{4,5}-\d{4}$/.test(data.phone) &&
          ("whatsapping" in data || "phoning" in data || "mailing" in data) &&
          data.dataPermissions === "on",
        offer: (data, form) =>
          Boolean(data.name) &&
          /^\w+([.-]?\w+)*@\w+([.-]?\w+)*(\.\w{2,3})+$/.test(data.email) &&
          /^\(\d{2}\) \d{4,5}-\d{4}$/.test(data.phone) &&
          (!form.elements.namedItem("cpf") || hasValidCpf(data.cpf)) &&
          ("whatsapping" in data || "phoning" in data || "mailing" in data),
        search: () => false,
        section: (data) =>
          Boolean(data.name.trim()) &&
          /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email) &&
          /^\d{10,11}$/.test(data.phone.replace(/\D/g, "")) &&
          hasValidCpf(data.cpf),
        stock: (data) =>
          Boolean(data.name.trim()) &&
          /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email) &&
          /^\d{10,11}$/.test(data.phone.replace(/\D/g, "")) &&
          data.message.startsWith("Lead de teste "),
      };

      document.addEventListener("submit", (event) => {
        event.preventDefault();

        const form = event.target;

        for (const [field, value] of controlled) {
          field.value = value;
        }

        const formData = new FormData(form);
        const data = {};

        for (const key of new Set(formData.keys())) {
          data[key] = key.endsWith("[]")
            ? formData.getAll(key)
            : formData.get(key);
        }

        const item = document.createElement("li");
        item.textContent = JSON.stringify({
          data,
          form: form.dataset.gtagLabel ?? "",
          valid: validators[form.dataset.fixture](data, form),
        });
        document.getElementById("submissions").append(item);
      });
    </script>
  </body>
</html>
